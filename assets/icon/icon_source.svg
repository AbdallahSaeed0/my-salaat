<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0E4A32"/>
      <stop offset="100%" stop-color="#052A1C"/>
    </radialGradient>

    <linearGradient id="crescentBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CE7E"/>
      <stop offset="50%" stop-color="#D9A94B"/>
      <stop offset="100%" stop-color="#B8823A"/>
    </linearGradient>

    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E7A4C"/>
      <stop offset="100%" stop-color="#0F5533"/>
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B6B44"/>
      <stop offset="100%" stop-color="#0D4128"/>
    </linearGradient>

    <linearGradient id="trim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3CE7E"/>
      <stop offset="100%" stop-color="#C9962E"/>
    </linearGradient>

    <!-- 8-point star lattice pattern for the crescent texture -->
    <pattern id="starPattern" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="46" height="46" fill="none"/>
      <g stroke="#0F5533" stroke-width="1.3" fill="none" opacity="0.5">
        <path d="M23 2 L27 14 L39 14 L29 21 L33 33 L23 26 L13 33 L17 21 L7 14 L19 14 Z"/>
      </g>
    </pattern>

    <!-- crescent shape: outer circle minus inner circle, opening to the right -->
    <mask id="crescentMask">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <circle cx="205" cy="256" r="178" fill="white"/>
      <circle cx="262" cy="256" r="158" fill="black"/>
    </mask>
  </defs>

  <!-- background -->
  <circle cx="256" cy="256" r="256" fill="url(#sky)"/>

  <!-- scattered stars in the sky -->
  <g fill="#EAF1FB">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="360" cy="70" r="2.4"/>
    <circle cx="430" cy="140" r="3.2"/>
    <circle cx="90" cy="180" r="2"/>
    <circle cx="410" cy="410" r="2.6"/>
    <circle cx="150" cy="440" r="2.2"/>
    <circle cx="440" cy="330" r="2"/>
  </g>

  <!-- crescent moon, gold base + green star-lattice texture (gold foil on green, Quran-cover feel) -->
  <g mask="url(#crescentMask)">
    <rect x="0" y="0" width="512" height="512" fill="url(#crescentBase)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#starPattern)"/>
  </g>

  <!-- mosque, nested in the open cusp of the crescent -->
  <g>
    <!-- minaret -->
    <rect x="392" y="150" width="16" height="230" fill="url(#wallGrad)"/>
    <rect x="386" y="150" width="28" height="10" rx="2" fill="url(#trim)"/>
    <path d="M386 150 Q400 118 414 150 Z" fill="url(#trim)"/>
    <rect x="397" y="98" width="6" height="20" fill="url(#trim)"/>
    <circle cx="400" cy="94" r="5" fill="url(#trim)"/>
    <rect x="388" y="260" width="24" height="18" fill="#04160D" opacity="0.85"/>

    <!-- main building block -->
    <rect x="228" y="222" width="170" height="158" fill="url(#wallGrad)"/>

    <!-- gold base trim -->
    <rect x="228" y="372" width="170" height="8" fill="url(#trim)"/>

    <!-- arch windows -->
    <g fill="#04160D">
      <path d="M250 380 L250 300 Q250 282 268 282 Q286 282 286 300 L286 380 Z"/>
      <path d="M298 380 L298 296 Q298 276 318 276 Q338 276 338 296 L338 380 Z"/>
      <path d="M350 380 L350 300 Q350 282 368 282 Q386 282 386 300 L386 380 Z"/>
    </g>

    <!-- gold arch outlines -->
    <g fill="none" stroke="url(#trim)" stroke-width="2.5" opacity="0.9">
      <path d="M250 380 L250 300 Q250 282 268 282 Q286 282 286 300 L286 380"/>
      <path d="M298 380 L298 296 Q298 276 318 276 Q338 276 338 296 L338 380"/>
      <path d="M350 380 L350 300 Q350 282 368 282 Q386 282 386 300 L386 380"/>
    </g>

    <!-- small arch band under dome -->
    <g fill="none" stroke="url(#trim)" stroke-width="2" opacity="0.7">
      <path d="M240 232 Q252 216 264 232"/>
      <path d="M268 232 Q280 216 292 232"/>
      <path d="M296 232 Q308 216 320 232"/>
      <path d="M324 232 Q336 216 348 232"/>
      <path d="M352 232 Q364 216 376 232"/>
    </g>

    <!-- dome drum -->
    <rect x="266" y="176" width="94" height="56" fill="url(#wallGrad)"/>
    <rect x="266" y="176" width="94" height="6" fill="url(#trim)"/>

    <!-- main dome -->
    <path d="M266 178
             C266 128 302 96 313 96
             C324 96 360 128 360 178 Z"
          fill="url(#domeGrad)"/>

    <!-- gold rib lines on dome -->
    <g stroke="url(#trim)" stroke-width="1.5" opacity="0.7" fill="none">
      <path d="M290 176 C290 140 300 108 313 97"/>
      <path d="M313 176 L313 97"/>
      <path d="M336 176 C336 140 326 108 313 97"/>
    </g>

    <!-- finial -->
    <rect x="309" y="66" width="8" height="30" fill="url(#trim)"/>
    <circle cx="313" cy="60" r="7" fill="url(#trim)"/>
  </g>
</svg>
